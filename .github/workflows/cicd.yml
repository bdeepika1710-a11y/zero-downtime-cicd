name: Zero Downtime CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Application Version
        run: echo "APP_VERSION=v${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/zero-downtime-app:${{ env.APP_VERSION }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/zero-downtime-app:${{ env.APP_VERSION }} ${{ secrets.DOCKER_USERNAME }}/zero-downtime-app:latest

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/zero-downtime-app:${{ env.APP_VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/zero-downtime-app:latest

      - name: Deploy to EC2 Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/zero-downtime-app:${{ env.APP_VERSION }}"
            APP_VERSION="${{ env.APP_VERSION }}"

            BLUE_PORT=5001
            GREEN_PORT=5002
            NGINX_CONFIG="/etc/nginx/sites-available/zero-downtime-app"

            echo "Starting zero downtime deployment..."
            echo "New Image: $IMAGE_NAME"

            CURRENT_PORT=$(grep -o "127.0.0.1:[0-9]*" $NGINX_CONFIG | cut -d ':' -f2)

            if [ "$CURRENT_PORT" = "$BLUE_PORT" ]; then
                NEW_PORT=$GREEN_PORT
                NEW_CONTAINER="app-green"
                OLD_CONTAINER="app-blue"
            else
                NEW_PORT=$BLUE_PORT
                NEW_CONTAINER="app-blue"
                OLD_CONTAINER="app-green"
            fi

            echo "Current live port: $CURRENT_PORT"
            echo "New deployment port: $NEW_PORT"

            docker pull $IMAGE_NAME

            docker rm -f $NEW_CONTAINER || true

            docker run -d \
              --name $NEW_CONTAINER \
              -p $NEW_PORT:5000 \
              -e APP_VERSION=$APP_VERSION \
              $IMAGE_NAME

            echo "Waiting for health check..."
            sleep 10

            curl -f http://127.0.0.1:$NEW_PORT/health

            echo "Health check passed."

            sudo sed -i "s/127.0.0.1:$CURRENT_PORT/127.0.0.1:$NEW_PORT/g" $NGINX_CONFIG

            sudo nginx -t
            sudo systemctl reload nginx

            echo "Traffic switched to new version."

            docker rm -f $OLD_CONTAINER || true

            echo "Old container removed."
            echo "Zero downtime deployment completed successfully."
